name: Nova AI Singularity CI/CD

on:
  push:
    branches: [ main, develop, phase-* ]
    tags: ['v*']
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant'
        required: true
        default: 'debug'
        type: choice
        options: [debug, release]

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true
  JAVA_VERSION: '17'

jobs:
  # ==========================================
  # STAGE 1: Code Quality & Security Scan
  # ==========================================
  quality-gate:
    name: 🔍 Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Run Android Lint
        run: ./gradlew lintDebug || true

      - name: Check for Secrets Leak
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # ==========================================
  # STAGE 2: Unit & Integration Tests
  # ==========================================
  test-suite:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --info

  # ==========================================
  # STAGE 3: Build Matrix (Debug + Release)
  # ==========================================
  build-matrix:
    name: 🏗️ Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    needs: test-suite
    strategy:
      matrix:
        variant: [debug, release]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore (Release Only)
        if: matrix.variant == 'release' && env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > nova-release.jks

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ matrix.variant }}" == "release" ]; then
            ./gradlew assembleRelease || ./gradlew assembleDebug
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-apk-${{ matrix.variant }}-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30

  # ==========================================
  # STAGE 4: Deploy & Notify (Main Branch Only)
  # ==========================================
  deploy-nightly:
    name: 🚀 Deploy Nightly
    runs-on: ubuntu-latest
    needs: build-matrix
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: nova-apk-debug-${{ github.sha }}

      - name: Create GitHub Release (Nightly)
        uses: softprops/action-gh-release@v1
        continue-on-error: true
        with:
          tag_name: nightly-${{ github.run_number }}
          name: "🌙 Nightly Build #${{ github.run_number }}"
          body: |
            Automated nightly build from commit ${{ github.sha }}

            ### ⚠️ Warning
            This is an unstable development build. May contain bugs.

            ### 📥 Download
            See assets below.
          files: app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # STAGE 5: Production Release (Tagged Commits)
  # ==========================================
  release-production:
    name: 🎉 Production Release
    runs-on: ubuntu-latest
    needs: build-matrix
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: nova-apk-release-${{ github.sha }}

      - name: Create Production Release
        uses: softprops/action-gh-release@v1
        continue-on-error: true
        with:
          files: app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
